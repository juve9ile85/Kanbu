<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Console — 게임 관리</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="topbar">
  <h1 class="topbar-title">ADMIN CONSOLE</h1>
  <div class="topbar-right">
    <span id="session-email" class="session-email"></span>
    <button id="clear-token-btn" class="btn-ghost">토큰 초기화</button>
    <button id="logout-btn" class="btn-ghost">로그아웃</button>
  </div>
</header>

<main class="page">



  <section class="panel">
    <div class="panel-head">
      <h2>사이트 목록</h2>
      <div class="panel-actions">
        <button id="add-btn" class="btn-primary">사이트 추가</button>
        <button id="publish-btn" class="btn-primary">적용</button>
      </div>
    </div>

    <table class="table" id="cards-table">
      <thead>
      <tr>
        <th style="width:40px;">#</th>
        <th style="width:100px;">이미지</th>
        <th style="width:160px;">라벨</th>
        <th>URL</th>
        <th style="width:90px;">상태</th>
        <th style="width:110px;">순서</th>
        <th style="width:70px;">관리</th>
      </tr>
      </thead>
      <tbody id="cards-tbody"></tbody>
    </table>

    <p class="empty" id="empty-msg" hidden>등록된 카드가 없습니다.</p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>미리보기 (유저페이지 카드)</h2>
    </div>
    <div class="preview" id="preview"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>JJ SOLUTION</h2>
    </div>
    <p class="hint">
  © 2026 JJ SOLUTION. 모든 권리 보유.<br />
  이 프로젝트는 MIT 라이선스로 배포되는 오픈소스입니다.
  누구나 자유롭게 사용·수정·배포할 수 있으나,
  수정·배포·사용으로 발생하는 모든 결과와 책임은 이용자에게 있습니다.
</p>
    <p class="status" id="save-status">대기 중</p>
  </section>
  <!-- 관리자페이지 URL 입력 모달 -->
  <div class="modal-backdrop" id="admin-url-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>관리자페이지 주소</h3>
        <button class="modal-close" id="modal-close-btn" aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <label for="admin-url-input" class="modal-label">URL</label>
        <input id="admin-url-input" type="url" placeholder="https://" />
        <p class="modal-hint" id="modal-hint"></p>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="modal-cancel-btn">취소</button>
        <button class="btn-ghost" id="modal-clear-btn">삭제</button>
        <button class="btn-primary" id="modal-save-btn">저장</button>
      </div>
    </div>
  </div>
</main>

<script src="./dashboard.js"></script>
</body>
</html>
